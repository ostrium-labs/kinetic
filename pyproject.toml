[project]
name = "ostrium-kinetic"
version = "0.1.0.dev0"
description = "Programmable cinematography for engineering: simulations and traces in, reproducible technical films out."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ostrium Labs" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "typer>=0.12",
    "ruamel.yaml>=0.18",
    "numpy>=2.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
# Renderer-side Python environment for the Manim adapter (M4). Not needed for M1.
manim = ["manim==0.22.1"]

[project.scripts]
kinetic = "ostrium_kinetic.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ostrium_kinetic"]

[tool.hatch.build.targets.wheel.force-include]
# The Godot runtime project; adapters/godot.py looks for it here when not in a repo checkout.
"renderers/godot" = "ostrium_kinetic/_renderers/godot"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "renderer(name): needs a renderer or media tool installed; skipped when absent",
]
